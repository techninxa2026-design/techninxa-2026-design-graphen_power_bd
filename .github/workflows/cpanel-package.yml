name: Build cPanel upload
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package:cpanel
      - name: Verify archive
        run: unzip -t releases/graphene-power-bd-cpanel.zip
      - name: Upload cPanel website
        uses: actions/upload-artifact@v4
        with:
          name: graphene-power-bd-cpanel
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
